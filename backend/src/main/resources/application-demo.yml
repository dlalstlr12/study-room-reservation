# 배포용 프로파일 (SPRING_PROFILES_ACTIVE=demo).
# 하나의 이미지로 두 곳에서 쓴다:
#   1) EC2 docker-compose  — MySQL/Redis/Kafka 를 같은 네트워크에서 자체 호스팅 (아래 기본값)
#   2) Render + TiDB + Upstash — 관리형 서비스. 아래 값들을 환경변수로 덮어씀
#
# 모든 접속 정보는 환경변수 주입. 기본값은 deploy/docker-compose.prod.yml 의 서비스명 기준.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/study_room?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:study_room}
    password: ${SPRING_DATASOURCE_PASSWORD:study_room}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Upstash 등 인증/TLS 브로커는 아래 두 값을 환경변수로 주입한다.
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    # Upstash 등 SASL_SSL 브로커는 아래 3개를 환경변수로 주입한다.
    #   SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_SSL
    #   SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=SCRAM-SHA-256
    #   SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required username="KEY" password="SECRET";
    # 미설정 시 PLAINTEXT (EC2 자체 호스팅 브로커)

jwt:
  # 최소 32바이트. 배포 시 반드시 JWT_SECRET 환경변수로 덮어쓸 것.
  secret: ${JWT_SECRET:demo-only-secret-change-me-please-32b-min}
  access-token-expire-ms: ${JWT_ACCESS_TOKEN_EXPIRE_MS:3600000}
  refresh-token-expire-ms: ${JWT_REFRESH_TOKEN_EXPIRE_MS:604800000}

app:
  cors:
    # EC2: http://<EC2_PUBLIC_IP>   /   분리 배포: https://<vercel-domain>
    # 쉼표로 여러 개 지정 가능.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}

logging:
  level:
    root: INFO
    com.studyroom: INFO
