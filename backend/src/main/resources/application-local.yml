spring:
  datasource:
    url: jdbc:mysql://localhost:3307/study_room?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: study_room
    password: study_room
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: change-this-secret-before-committing-anything-real
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 604800000

logging:
  level:
    com.studyroom: DEBUG
