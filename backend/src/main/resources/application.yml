spring:
  application:
    name: study-room-reservation
  profiles:
    active: local

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173

reservation:
  lock:
    # none | pessimistic | distributed  (배경·비교: docs/troubleshooting.md)
    strategy: pessimistic
