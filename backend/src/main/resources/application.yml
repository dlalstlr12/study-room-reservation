spring:
  application:
    name: study-room-reservation
  profiles:
    active: local

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173

reservation:
  lock:
    # none | pessimistic | distributed  — 부하테스트 비교용으로 전환
    strategy: none
