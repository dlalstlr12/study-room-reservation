# EC2 자체 호스팅용 전체 스택 (로드맵 9단계 — "AWS 에 올려서 동작 확인" 목적).
# 검증이 끝나면 인스턴스를 Terminate 하므로 영속 볼륨/스냅샷은 남기지 않는다.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# 상시 무료 배포(Render + TiDB + Upstash)는 이 파일을 쓰지 않고 backend/Dockerfile 이미지만 사용한다.

name: study-room

services:
  mysql:
    image: mysql:8.0
    container_name: sr-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_room}
      MYSQL_USER: ${MYSQL_USER:-study_room}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-study_room}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: sr-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # KRaft 모드 단일 브로커 (ZooKeeper 없음). DOCKER 리스너로 컨테이너끼리 통신.
  kafka:
    image: apache/kafka:3.8.0
    container_name: sr-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sr-backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-study_room}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-study_room}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-study_room}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 는 deploy/.env 에 설정해야 합니다 (32바이트 이상)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?EC2 퍼블릭 IP/도메인 오리진을 deploy/.env 에 설정하세요}
    depends_on:
      mysql:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 빈 값 = 같은 오리진(nginx 프록시). 프론트 재빌드 없이 IP 변경 대응.
        VITE_API_BASE_URL: ""
    container_name: sr-frontend
    ports:
      - "80:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # 토픽·컨슈머 lag 스크린샷용. 데모 후 제거 가능.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: sr-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ec2
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
