services:
  mysql:
    image: mysql:8.0
    container_name: study-room-mysql
    environment:
      MYSQL_DATABASE: study_room
      MYSQL_USER: study_room
      MYSQL_PASSWORD: study_room
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: study-room-redis
    ports:
      - "6379:6379"

  # 로드맵 6단계 — 비동기 알림. KRaft 모드 단일 브로커 (ZooKeeper 없음).
  kafka:
    image: apache/kafka:3.8.0
    container_name: study-room-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST = 호스트에서 접속(앱), DOCKER = 컨테이너끼리 접속(kafka-ui)
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 토픽·메시지·컨슈머 lag 확인용 (포트폴리오 스크린샷). 없어도 앱은 동작한다.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: study-room-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

volumes:
  mysql-data:
