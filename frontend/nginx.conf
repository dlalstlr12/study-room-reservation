# EC2 자체 호스팅용 nginx. 정적 SPA + 백엔드 리버스 프록시(같은 오리진).
# 브라우저는 http://<EC2_IP>/ 하나의 오리진만 보므로 CORS 프리플라이트가 발생하지 않는다.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over native WebSocket
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header Origin     $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger UI (배포 시연에서 API 문서 스크린샷용)
    location /swagger-ui/   { proxy_pass http://backend; proxy_set_header Host $host; }
    location /swagger-ui.html { proxy_pass http://backend; proxy_set_header Host $host; }
    location /v3/api-docs   { proxy_pass http://backend; proxy_set_header Host $host; }
    location /v3/api-docs/  { proxy_pass http://backend; proxy_set_header Host $host; }

    # SPA 라우팅 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }
}
